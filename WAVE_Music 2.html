<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="telegram:channel" content="">
<title>WAVE — Музыка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #050506;
    --card: rgba(255,255,255,.075);
    --card-hover: rgba(255,255,255,.12);
    --border: rgba(255,255,255,.12);
    --text: #fff;
    --muted: #8f8f96;
    --accent: #fff;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 70% 10%, #24242a 0%, transparent 30%),
        radial-gradient(circle at 10% 80%, #15151b 0%, transparent 35%),
        var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Segoe UI", sans-serif;
    overflow-x: hidden;
}

/* ---------- GLASS ---------- */

.glass {
    background: rgba(255,255,255,.065);
    border: 1px solid rgba(255,255,255,.11);
    backdrop-filter: blur(25px) saturate(140%);
    -webkit-backdrop-filter: blur(25px) saturate(140%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 15px 40px rgba(0,0,0,.22);
}

/* ---------- SIDEBAR ---------- */

.sidebar {
    position: fixed;
    left: 18px;
    top: 18px;
    bottom: 18px;
    width: 235px;
    padding: 20px;
    border-radius: 40px;
    z-index: 20;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin: 4px 8px 30px;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.nav button {
    border: 0;
    color: #aaaab0;
    background: transparent;
    padding: 13px 14px;
    border-radius: 24px;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
    transition: .25s;
}

.nav button:hover {
    background: rgba(255,255,255,.08);
    color: white;
    transform: translateX(2px);
}

.nav button.active {
    color: white;
    background: rgba(255,255,255,.12);
    box-shadow: inset 0 1px rgba(255,255,255,.08);
}

.icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    vertical-align: middle;
}

.icon svg {
    display: block;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon-home,
.icon-search {
    width: 24px;
    height: 24px;
}

.icon-music {
    width: 20px;
    height: 20px;
}

/* ---------- MAIN ---------- */

main {
    margin-left: 275px;
    padding: 28px 35px 150px;
    max-width: 1450px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 35px;
}

.search {
    width: min(500px, 100%);
    padding: 14px 19px;
    border-radius: 28px;
    color: white;
    outline: none;
    font-size: 15px;
}

.search::placeholder {
    color: #77777e;
}

.profile {
    padding: 10px 15px;
    border-radius: 26px;
    display: flex;
    gap: 10px;
    align-items: center;
    cursor: pointer;
}

.avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg,#777,#222);
}

/* ---------- HERO / BALANCE ---------- */

.hero {
    position: relative;
    min-height: auto;
    border: none;
    overflow: visible;
    padding: 36px 10px 40px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
}

.balance-label {
    border: none;
    outline: none;
    background: transparent;
    color: #fff;
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: -1.5px;
    cursor: pointer;
    padding: 0;
    margin: 0;
    transition: .3s;
    text-shadow: 0 4px 30px rgba(0,0,0,.45);
}

.balance-label:hover {
    transform: scale(1.04);
    text-shadow: 0 6px 40px rgba(255,255,255,.2);
}

.balance-label:active {
    transform: scale(0.98);
}

.sidebar-search {
    width: 100%;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
    color: #fff;
    outline: none;
    font-size: 14px;
}

.sidebar-search::placeholder {
    color: #77777e;
}


.mobile-search {
    display: none;
}


/* ---------- SECTIONS ---------- */

.section {
    margin-bottom: 35px;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 17px;
}

.section h2 {
    font-size: 25px;
    letter-spacing: -.8px;
}

.see {
    color: #888890;
    cursor: pointer;
    font-size: 14px;
}

/* ---------- TRACKS ---------- */

.tracks {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(170px,1fr));
    gap: 15px;
}

.track {
    padding: 11px;
    border-radius: 32px;
    cursor: pointer;
    transition: .3s;
}

.track:hover {
    background: var(--card-hover);
    transform: translateY(-5px);
}

.cover {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 26px;
    object-fit: cover;
    margin-bottom: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
}

.track-name {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.artist {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

/* ---------- WAVE ---------- */

.wave {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.wave-track {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 9px 12px;
    border-radius: 26px;
    transition: .2s;
    cursor: pointer;
}

.wave-track:hover {
    background: rgba(255,255,255,.07);
}

.wave-cover {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    object-fit: cover;
}

.wave-info {
    min-width: 0;
}

.wave-title {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.wave-artist {
    color: #85858d;
    font-size: 13px;
    margin-top: 3px;
}

.duration {
    color: #777780;
    font-size: 13px;
}

/* ---------- PLAYER ---------- */

.player {
    position: fixed;
    left: 18px;
    right: 18px;
    bottom: 18px;
    height: 88px;
    border-radius: 40px;
    z-index: 50;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 12px 18px;
}

.now {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.now img {
    width: 58px;
    height: 58px;
    border-radius: 20px;
    object-fit: cover;
}

.now-text {
    min-width: 0;
}

.now-title {
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.now-artist {
    color: #85858c;
    font-size: 13px;
    margin-top: 4px;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.control {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.08);
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: .2s;
}

.control:hover {
    background: rgba(255,255,255,.18);
    transform: scale(1.06);
}

.play {
    width: 52px;
    height: 52px;
    background: white;
    color: black;
    font-size: 18px;
}

.right-player {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
}




.volume {
    width: 100px;
    accent-color: white;
}

.progress {
    position: absolute;
    left: 22px;
    right: 22px;
    top: -4px;
    height: 5px;
    cursor: pointer;
    appearance: none;
    background: rgba(255,255,255,.14);
    border-radius: 20px;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: white;
}


/* ---------- NOW PLAYING SHEET ---------- */

.np-sheet {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: stretch;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .28s ease;
}

.np-sheet.open {
    pointer-events: auto;
    opacity: 1;
}

.np-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.4);
}

.np-panel {
    position: relative;
    width: 100%;
    max-width: none;
    height: 100%;
    max-height: none;
    margin: 0;
    padding: 16px 24px 40px;
    border-radius: 0;
    background: #0c0c0e;
    border: none;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    transform: translateY(100%);
    transition: transform .38s cubic-bezier(.2,.8,.2,1);
    overflow: auto;
    z-index: 1;
    display: flex;
    flex-direction: column;
}

.np-bg {
    position: absolute;
    inset: -40px;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.np-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(1.15);
    filter: blur(48px) saturate(1.25) brightness(0.45);
    opacity: 0.95;
}

.np-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(180deg, rgba(8,8,10,.35) 0%, rgba(8,8,10,.55) 45%, rgba(8,8,10,.82) 100%);
}

.np-panel > *:not(.np-bg) {
    position: relative;
    z-index: 1;
}

.np-sheet.open .np-panel {
    transform: translateY(0);
}

.np-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0 8px;
    flex-shrink: 0;
}

.np-top-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06);
    color: #ddd;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
}

.np-top-btn:hover {
    background: rgba(255,255,255,.14);
    color: #fff;
}

.np-top-center {
    flex: 1;
    text-align: center;
    min-width: 0;
}

.np-playlist {
    font-size: 13px;
    color: #c8c8ce;
    letter-spacing: .2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.np-device {
    font-size: 12px;
    color: #8a8a92;
    margin-top: 2px;
}

.np-cover-wrap {
    width: min(340px, 78vw);
    aspect-ratio: 1;
    margin: 20px auto 28px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
        0 24px 50px rgba(0,0,0,.5),
        0 0 0 1px rgba(255,255,255,.06);
    flex-shrink: 0;
}

.np-cover-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.np-meta {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
    padding: 0 4px;
}

.np-meta-text {
    min-width: 0;
    flex: 1;
}

.np-title {
    text-align: left;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.4px;
    margin-bottom: 4px;
    line-height: 1.25;
}

.np-artist {
    text-align: left;
    color: #9a9aa2;
    font-size: 15px;
}

.np-meta-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

.np-icon-btn {
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.05);
    color: #b0b0b8;
    font-size: 16px;
    cursor: pointer;
    border-radius: 50%;
    transition: .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}

.np-icon-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: block;
}

.np-icon-btn:hover {
    color: #fff;
    background: rgba(255,255,255,.12);
}

.np-progress {
    width: 100%;
    height: 4px;
    appearance: none;
    background: rgba(255,255,255,.16);
    border-radius: 20px;
    cursor: pointer;
    accent-color: #fff;
}

.np-progress::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: white;
}

.np-times {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8a8a92;
    margin-top: 8px;
    margin-bottom: 28px;
}

.np-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 8px 0 12px;
    margin-top: auto;
}

.np-controls .side-btn,
.np-controls .nav-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
    color: #d0d0d6;
    font-size: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
    padding: 0;
}

.np-controls .side-btn:hover,
.np-controls .nav-btn:hover {
    background: rgba(255,255,255,.12);
    color: #fff;
}

.np-controls .side-btn svg,
.np-controls .nav-btn svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.np-controls .nav-btn svg {
    width: 26px;
    height: 26px;
    fill: #9aa0ae;
    stroke: none;
}

.np-controls .play {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: #111;
    font-size: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 28px rgba(255,255,255,.15);
    transition: transform .2s;
    padding: 0;
}

.np-controls .play:hover {
    transform: scale(1.05);
}

.np-controls .play svg {
    width: 28px;
    height: 28px;
    fill: #111;
    stroke: none;
}

.np-controls .play.playing svg.icon-play { display: none; }
.np-controls .play:not(.playing) svg.icon-pause { display: none; }

.np-extra {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 22px;
}

.np-chip {
    min-width: 52px;
    height: 40px;
    padding: 0 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06);
    color: #c8c8ce;
    font-size: 13px;
    cursor: pointer;
    transition: .2s;
}

.np-chip:hover {
    background: rgba(255,255,255,.14);
    color: #fff;
}

.np-chip.active {
    background: rgba(255,255,255,.2);
    color: #fff;
    border-color: rgba(255,255,255,.35);
}

.np-controls .side-btn.liked {
    color: #ff6b8a;
    border-color: rgba(255,107,138,.4);
    background: rgba(255,107,138,.12);
}

.np-controls .side-btn.liked svg {
    fill: #ff6b8a;
    stroke: #ff6b8a;
}

.np-toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,34,.92);
    border: 1px solid rgba(255,255,255,.12);
    color: #fff;
    padding: 12px 18px;
    border-radius: 16px;
    font-size: 14px;
    z-index: 120;
    opacity: 0;
    pointer-events: none;
    transition: .25s ease;
    backdrop-filter: blur(12px);
}

.np-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}


.now {
    cursor: pointer;
}

.now:hover .now-title {
    text-decoration: underline;
    text-underline-offset: 3px;
}

/* ---------- MOBILE ---------- */

@media(max-width:800px) {

    .sidebar {
        top: auto;
        left: 10px;
        right: 10px;
        bottom: 105px;
        width: auto;
        height: 65px;
        padding: 7px;
        border-radius: 32px;
    }

    .logo {
        display: none;
    }

    .nav {
        flex-direction: row;
        justify-content: space-around;
        height: 100%;
    }

    .nav button {
        font-size: 0;
        text-align: center;
        padding: 10px;
        flex: 1;
    }

    .nav button .icon {
        width: 24px;
        height: 24px;
    }

    .nav button .icon-home,
    .nav button .icon-search {
        width: 28px;
        height: 28px;
    }

    .nav button .icon-music {
        width: 24px;
        height: 24px;
    }

    main {
        margin-left: 0;
        padding: 18px 15px 190px;
    }

    .topbar {
        margin-bottom: 20px;
    }

    .profile {
        display: none;
    }

    .hero {
        padding: 12px 8px 20px;
        min-height: auto;
    }

    .balance-label {
        font-size: 28px;
    }

    .sidebar-search {
        display: none;
    }

    .mobile-search {
        display: block;
        width: min(500px, 100%);
    }

    .tracks {
        grid-template-columns: repeat(2,1fr);
    }

    .player {
        left: 10px;
        right: 10px;
        bottom: 10px;
        height: 82px;
        grid-template-columns: 1fr auto;
    }

    .right-player {
        display: none;
    }



    .controls {
        gap: 5px;
    }

    .control {
        width: 38px;
        height: 38px;
    }

    .play {
        width: 46px;
        height: 46px;
    }

    .now img {
        width: 50px;
        height: 50px;
    }
}

/* Jamendo */
.jamendo-setup-btn {
    width: 100%;
    margin-top: 10px;
    padding: 11px 14px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255, 136, 0, 0.12);
    color: #ff9f1a;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
}
.jamendo-setup-btn:hover { background: rgba(255, 136, 0, 0.22); }
.jamendo-setup-btn.connected {
    color: #fff;
    background: rgba(255, 136, 0, 0.3);
    border-color: rgba(255, 136, 0, 0.5);
}
.jm-modal {
    position: fixed; inset: 0; z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 20px;
}
.jm-modal.open { display: flex; }
.jm-modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
}
.jm-modal-card {
    position: relative; z-index: 1; width: min(420px, 100%);
    padding: 22px; border-radius: 24px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(22,22,26,.92);
}
.jm-modal-card h3 { margin: 0 0 8px; font-size: 20px; }
.jm-hint { color: #9a9aa2; font-size: 13px; line-height: 1.45; margin: 0 0 16px; }
.jm-hint a { color: #ff9f1a; }
.jm-modal-card label { display: block; font-size: 12px; color: #aaa; margin-bottom: 12px; }
.jm-modal-card input {
    width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06);
    color: #fff; outline: none; font-size: 14px;
}
.jm-modal-actions { display: flex; gap: 10px; margin-top: 8px; }
.jm-btn {
    flex: 1; padding: 12px; border-radius: 16px; border: none;
    background: #ff9f1a; color: #1a0a00; font-weight: 700; cursor: pointer;
}
.jm-btn.ghost { background: rgba(255,255,255,.08); color: #fff; }
.jm-status { margin: 12px 0 0; font-size: 13px; color: #9a9aa2; min-height: 1.2em; }

/* Telegram Mini App */
html.tg-webapp, body.tg-webapp {
    background: var(--tg-bg, var(--bg));
}
body.tg-webapp {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}
.tg-badge {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #8f8f96;
    margin-top: 8px;
}
body.tg-webapp .tg-badge { display: flex; }

</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar glass">

<script>

/* =========================
   WAVE MUSIC LIBRARY
========================= */

const catalog = [

    {

    },

    },
    {

        cover: "https://picsum.photos/seed/wave6/500/500",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
        local: "audio/song6.mp3",
        duration: "6:18"
    },
    {
        id: 7,
        title: "Ocean Drive",
        artist: "Synthwave Kid",
        cover: "https://picsum.photos/seed/wave7/500/500",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3",
        local: "audio/song7.mp3",
        duration: "5:33"
    },
    {
        id: 8,
        title: "Chrome Hearts",
        artist: "Retrowave",
        cover: "https://picsum.photos/seed/wave8/500/500",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
        local: "audio/song8.mp3",
        duration: "4:51"
    },
    {
        id: 9,
        title: "Silent Running",
        artist: "Analog Heart",
        cover: "https://picsum.photos/seed/wave9/500/500",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3",
        local: "audio/song9.mp3",
        duration: "6:40"
    },
    {
        id: 10,
        title: "Electric Dreams",
        artist: "Pixel Night",
        cover: "https://picsum.photos/seed/wave10/500/500",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3",
        local: "audio/song10.mp3",
        duration: "5:27"
    },
    {
        id: 11,
        title: "Stellar",
        artist: "Cosmo Wave",
        cover: "https://picsum.photos/seed/wave11/500/500",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3",
        local: "audio/song11.mp3",
        duration: "4:58"
    },
    {
        id: 12,
        title: "Velvet Sky",
        artist: "Luna Echo",
        cover: "https://picsum.photos/seed/wave12/500/500",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3",
        local: "audio/song12.mp3",
        duration: "5:41"
    }
];

/* =========================
   STATE
========================= */

let songs = [...catalog];
let current = 0;
let isPlaying = false;
let library = JSON.parse(localStorage.getItem("wave_library") || "[]");
let shuffleOn = localStorage.getItem("wave_shuffle") === "1";
let repeatMode = localStorage.getItem("wave_repeat") || "off"; // off | one | all
let qualityMode = localStorage.getItem("wave_quality") || "HD"; // SD | HD | HiFi
let shuffleOrder = [];

const audio = document.getElementById("audio");
audio.volume = 0.8;

const recommendationsList = catalog.slice(0, 8);
const popularList = catalog.slice(4, 12);

/* =========================
   RENDER HELPERS
========================= */

function makeTrackCard(song, index, listRef) {
    const card = document.createElement("div");
    card.className = "track";
    card.dataset.title = song.title.toLowerCase();
    card.dataset.artist = song.artist.toLowerCase();
    card.innerHTML = `
        <img class="cover" src="${song.cover}" loading="lazy" alt="">
        <div class="track-name">${song.title}</div>
        <div class="artist">${song.artist}</div>
    `;
    card.onclick = () => {
        songs = listRef;
        playSong(index);
    };
    return card;
}

function makeWaveRow(song, index, listRef) {
    const row = document.createElement("div");
    row.className = "wave-track glass";
    row.dataset.title = song.title.toLowerCase();
    row.dataset.artist = song.artist.toLowerCase();
    row.innerHTML = `
        <img class="wave-cover" src="${song.cover}" loading="lazy" alt="">
        <div class="wave-info">
            <div class="wave-title">${song.title}</div>
            <div class="wave-artist">${song.artist}</div>
        </div>
        <div class="duration">${song.duration}</div>
    `;
    row.onclick = () => {
        songs = listRef;
        playSong(index);
    };
    return row;
}

function clearAndFill(containerId, items, type, listRef) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = "";
    if (!items.length) {
        el.innerHTML = `<p style="color:#888;padding:20px 0">Ничего не найдено</p>`;
        return;
    }
    items.forEach((song, i) => {
        if (type === "card") el.appendChild(makeTrackCard(song, i, listRef));
        else el.appendChild(makeWaveRow(song, i, listRef));
    });
}

function loadHome() {
    clearAndFill("recommendations", recommendationsList, "card", recommendationsList);
    clearAndFill("popular", popularList, "row", popularList);
}

function renderLibrary() {
    clearAndFill("libraryList", library, "card", library);
}

/* =========================
   PLAYER
========================= */

function setWavesPlaying(playing) {
    const hero = document.getElementById("heroBalance");
    if (hero) {
        if (playing) hero.classList.add("playing");
        else hero.classList.remove("playing");
    }
    // Drive Metamorphosis morph speed
    if (typeof window.__metaSetPlaying === "function") {
        window.__metaSetPlaying(playing);
    }
}

function playSong(index) {
    if (!songs.length || index < 0 || index >= songs.length) return;
    current = index;
    const song = songs[index];
    document.getElementById("playerTitle").textContent = song.title;
    document.getElementById("playerArtist").textContent = song.artist;
    document.getElementById("playerCover").src = song.cover;
    if (typeof syncNowPlayingUI === "function") syncNowPlayingUI();

    if (!song.audio) {
        if (typeof showToast === "function") showToast("Нет аудио для этого трека");
        return;
    }

    audio.src = song.audio;
    applyRepeatMode();
    audio.play().catch(() => {});
    isPlaying = true;
    document.getElementById("playButton").textContent = "Ⅱ";
    const _np1 = document.getElementById("npPlayButton"); if (_np1) _np1.classList.add("playing");
    setWavesPlaying(true);
}

function togglePlay() {
    if (!audio.src) {
        if (songs.length) playSong(0);
        else {
            songs = recommendationsList;
            playSong(0);
        }
        return;
    }
    if (audio.paused) {
        audio.play();
        isPlaying = true;
        document.getElementById("playButton").textContent = "Ⅱ";
    const _np1 = document.getElementById("npPlayButton"); if (_np1) _np1.classList.add("playing");
        setWavesPlaying(true);
    } else {
        audio.pause();
        isPlaying = false;
        document.getElementById("playButton").textContent = "▶";
    const _np2 = document.getElementById("npPlayButton"); if (_np2) _np2.classList.remove("playing");
        setWavesPlaying(false);
    }
}

function rebuildShuffleOrder() {
    shuffleOrder = songs.map((_, i) => i);
    for (let i = shuffleOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
    }
}

function applyRepeatMode() {
    audio.loop = (repeatMode === "one");
}

function next() {
    if (!songs.length) return;
    // manual next always advances (even in repeat-one)
    if (shuffleOn) {
        if (!shuffleOrder.length) rebuildShuffleOrder();
        let pos = shuffleOrder.indexOf(current);
        if (pos < 0) pos = 0;
        pos = (pos + 1) % shuffleOrder.length;
        current = shuffleOrder[pos];
    } else {
        current = (current + 1) % songs.length;
    }
    playSong(current);
}

function previous() {
    if (!songs.length) return;
    if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
    }
    if (shuffleOn) {
        if (!shuffleOrder.length) rebuildShuffleOrder();
        let pos = shuffleOrder.indexOf(current);
        if (pos < 0) pos = 0;
        pos = (pos - 1 + shuffleOrder.length) % shuffleOrder.length;
        current = shuffleOrder[pos];
    } else {
        current = (current - 1 + songs.length) % songs.length;
    }
    playSong(current);
}

audio.addEventListener("ended", () => {
    // native audio.loop handles "one"
    if (repeatMode === "one" || audio.loop) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
        isPlaying = true;
        document.getElementById("playButton").textContent = "Ⅱ";
        const np = document.getElementById("npPlayButton");
        if (np) np.classList.add("playing");
        setWavesPlaying(true);
        return;
    }
    if (repeatMode === "off" && !shuffleOn && current >= songs.length - 1) {
        isPlaying = false;
        document.getElementById("playButton").textContent = "▶";
        const np = document.getElementById("npPlayButton");
        if (np) np.classList.remove("playing");
        setWavesPlaying(false);
        return;
    }
    next();
});

audio.addEventListener("timeupdate", () => {
    if (!audio.duration) return;
    document.getElementById("progress").value = (audio.currentTime / audio.duration) * 100;
    if (typeof updateSheetProgress === "function") updateSheetProgress();
});

function seekMusic() {
    if (!audio.duration) return;
    audio.currentTime = (document.getElementById("progress").value / 100) * audio.duration;
}

/* =========================
   LIBRARY / BALANCE
========================= */


function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ":" + String(s).padStart(2, "0");
}

function openNowPlaying() {
    const sheet = document.getElementById("nowPlayingSheet");
    if (!sheet) return;
    syncNowPlayingUI();
    sheet.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
}

function closeNowPlaying() {
    const sheet = document.getElementById("nowPlayingSheet");
    if (!sheet) return;
    sheet.classList.remove("open");
    sheet.setAttribute("aria-hidden", "true");
}

function syncNowPlayingUI() {
    const cover = document.getElementById("playerCover");
    const title = document.getElementById("playerTitle");
    const artist = document.getElementById("playerArtist");
    const npCover = document.getElementById("npCover");
    const npBgCover = document.getElementById("npBgCover");
    const npTitle = document.getElementById("npTitle");
    const npArtist = document.getElementById("npArtist");
    if (npCover && cover) npCover.src = cover.src;
    if (npBgCover && cover) npBgCover.src = cover.src;
    if (npTitle && title) npTitle.textContent = title.textContent;
    if (npArtist && artist) npArtist.textContent = artist.textContent;
    const playBtn = document.getElementById("playButton");
    const npPlay = document.getElementById("npPlayButton");
    if (npPlay) {
        if (typeof isPlaying !== "undefined" && isPlaying) npPlay.classList.add("playing");
        else npPlay.classList.remove("playing");
    }
    if (typeof updateLikeButton === "function") updateLikeButton();
    const pl = document.getElementById("npPlaylist");
    if (pl) pl.textContent = "WAVE · сейчас";
    updateSheetProgress();
}

function updateSheetProgress() {
    const audio = document.getElementById("audio");
    if (!audio) return;
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    const npProgress = document.getElementById("npProgress");
    if (npProgress && document.activeElement !== npProgress) {
        npProgress.value = pct;
    }
    const cur = document.getElementById("npCurrent");
    const dur = document.getElementById("npDuration");
    if (cur) cur.textContent = formatTime(audio.currentTime || 0);
    if (dur) dur.textContent = formatTime(audio.duration || 0);
}

function seekFromSheet() {
    const audio = document.getElementById("audio");
    const npProgress = document.getElementById("npProgress");
    const progress = document.getElementById("progress");
    if (!audio || !audio.duration) return;
    audio.currentTime = (npProgress.value / 100) * audio.duration;
    if (progress) progress.value = npProgress.value;
}



function showToast(msg) {
    let t = document.getElementById("npToast");
    if (!t) {
        t = document.createElement("div");
        t.id = "npToast";
        t.className = "np-toast";
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

function getCurrentSong() {
    if (!songs.length || current < 0 || current >= songs.length) return null;
    return songs[current];
}

function isLiked(song) {
    if (!song) return false;
    return library.some(s => s.title === song.title && s.artist === song.artist);
}

function updateLikeButton() {
    const btn = document.getElementById("npLikeBtn");
    if (!btn) return;
    btn.classList.toggle("liked", isLiked(getCurrentSong()));
}

function toggleLike() {
    const song = getCurrentSong();
    if (!song) {
        showToast("Сначала выберите трек");
        return;
    }
    const idx = library.findIndex(s => s.title === song.title && s.artist === song.artist);
    if (idx >= 0) {
        library.splice(idx, 1);
        showToast("Удалено из «Моя музыка»");
    } else {
        library.push({ ...song });
        showToast("Добавлено в «Моя музыка»");
    }

function copyTextFallback(text) {
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(function () {
                showToast("Скопировано в буфер");
                return true;
            }).catch(function () {
                return false;
            });
        }
    } catch (e) {}
    try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (ok) {
            showToast("Скопировано в буфер");
            return Promise.resolve(true);
        }
    } catch (e2) {}
    return Promise.resolve(false);
}

async function shareTrack() {

    var artistEl = document.getElementById("playerArtist");
    var title = song ? song.title : (titleEl ? titleEl.textContent : "WAVE");
    var artist = song ? song.artist : (artistEl ? artistEl.textContent : "");
    var text = artist ? (title + " — " + artist) : title;
    var shareData = { title: title, text: text + " · WAVE", url: location.href };

    if (navigator.share) {
        try {
            await navigator.share(shareData);
            showToast("Отправлено");
            return;
        } catch (e) {
            if (e && e.name === "AbortError") return;
            // fall through to copy
        }
    }

    var copied = await copyTextFallback(text + " · WAVE");
    if (!copied) {
        prompt("Скопируйте название трека:", text + " · WAVE");
    }
}

function saveBlobAsFile(blob, filename) {
    var mp3Blob = blob.type && blob.type.indexOf("audio") === 0
        ? blob
        : new Blob([blob], { type: "audio/mpeg" });
    var url = URL.createObjectURL(mp3Blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

async function fetchAudioBlob(audioUrl) {
    var attempts = [audioUrl];
    // only use proxies for remote http(s) URLs
    if (/^https?:\/\//i.test(audioUrl) && audioUrl.indexOf(location.origin) !== 0) {
        attempts.push("https://corsproxy.io/?" + encodeURIComponent(audioUrl));
        attempts.push("https://api.allorigins.win/raw?url=" + encodeURIComponent(audioUrl));
    }
    var lastErr = null;
    for (var i = 0; i < attempts.length; i++) {
        try {
            var res = await fetch(attempts[i]);
            if (!res.ok) throw new Error("HTTP " + res.status);
            var blob = await res.blob();
            if (!blob || blob.size < 1000) throw new Error("empty blob");
            return blob;
        } catch (err) {
            lastErr = err;
        }
    }
    throw lastErr || new Error("download failed");
}

async function downloadTrack() {
    var song = getCurrentSong();
    if (!song || (!song.audio && !song.local)) {
        showToast("Сначала выберите трек");
        return;
    }
    var filename = (song.artist + " - " + song.title).replace(/[\\/:*?"<>|]/g, "_") + ".mp3";
    showToast("Скачивание MP3…");

    var candidates = [];
    if (song.local) {
        try { candidates.push(new URL(song.local, window.location.href).href); } catch (e) { candidates.push(song.local); }
    }
    if (song.audio) {
        try { candidates.push(new URL(song.audio, window.location.href).href); } catch (e2) { candidates.push(song.audio); }
    }

    var lastErr = null;
    for (var i = 0; i < candidates.length; i++) {
        try {
            var blob = await fetchAudioBlob(candidates[i]);
            saveBlobAsFile(blob, filename);
            showToast("Сохранено: " + filename);
            return;
        } catch (err) {
            lastErr = err;
        }
    }
    console.error(lastErr);
    showToast("Не удалось скачать MP3");
}

function formatMsLib(ms) {
    if (!ms || !isFinite(ms)) return "";
    var s = Math.round(ms / 1000);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + String(r).padStart(2, "0");
}

function getJamendoId() {
    return localStorage.getItem("wave_jamendo_id") || "";
}
function isJamendoConfigured() {
    return !!getJamendoId();
}
function updateJamendoBtn() {
    var btn = document.querySelector(".jamendo-setup-btn");
    if (!btn) return;
    if (isJamendoConfigured()) {
        btn.classList.add("connected");
        btn.textContent = "Jamendo ✓";
    } else {
        btn.classList.remove("connected");
        btn.textContent = "Jamendo (free)";
    }
}
function openJamendoSetup() {
    var modal = document.getElementById("jamendoModal");
    var el = document.getElementById("jmClientId");
    if (el) el.value = getJamendoId();
    var st = document.getElementById("jmStatus");
    if (st) st.textContent = isJamendoConfigured() ? "Client ID сохранён" : "";
    if (modal) { modal.classList.add("open"); modal.setAttribute("aria-hidden", "false"); }
}
function closeJamendoSetup() {
    var modal = document.getElementById("jamendoModal");
    if (modal) { modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true"); }
}
async function saveJamendoSetup() {
    var id = (document.getElementById("jmClientId").value || "").trim();
    var st = document.getElementById("jmStatus");
    if (!id) { if (st) st.textContent = "Введи Client ID"; return; }
    localStorage.setItem("wave_jamendo_id", id);
    if (st) st.textContent = "Проверка…";
    try {
        var test = await fetchJamendo("ambient", 3);
        if (!test.length) throw new Error("empty");
        if (st) st.textContent = "Подключено ✓";
        updateJamendoBtn();
        if (typeof showToast === "function") showToast("Jamendo подключён");
        loadJamendoCharts();
        setTimeout(closeJamendoSetup, 700);
    } catch (e) {
        console.error(e);
        if (st) st.textContent = "Ошибка: проверь Client ID";
    }
}

function mapJamendoTrack(t) {
    var cover = (t.album_image || t.image || "").replace(/width=\d+/, "width=500") || "https://picsum.photos/seed/jm/500/500";
    return {
        id: "jm_" + t.id,
        title: t.name || "Unknown",
        artist: t.artist_name || "Unknown",
        cover: cover,
        audio: t.audio || t.audiodownload || "",
        duration: formatMsLib((t.duration || 0) * 1000),
        source: "jamendo",
        local: null
    };
}

async function fetchJamendo(term, limit) {
    limit = limit || 24;
    var clientId = getJamendoId();
    if (!clientId) throw new Error("Jamendo not configured");
    var url = "https://api.jamendo.com/v3.0/tracks/?client_id=" + encodeURIComponent(clientId) +
        "&format=json&limit=" + limit +
        "&include=musicinfo&audioformat=mp32" +
        "&search=" + encodeURIComponent(term);
    var res = await fetch(url);
    if (!res.ok) throw new Error("Jamendo HTTP " + res.status);
    var data = await res.json();
    if (data.headers && data.headers.error_message) throw new Error(data.headers.error_message);
    return (data.results || []).filter(function (t) { return t.audio || t.audiodownload; }).map(mapJamendoTrack);
}

async function fetchJamendoPopular(limit) {
    limit = limit || 16;
    var clientId = getJamendoId();
    if (!clientId) throw new Error("Jamendo not configured");
    var url = "https://api.jamendo.com/v3.0/tracks/?client_id=" + encodeURIComponent(clientId) +
        "&format=json&limit=" + limit +
        "&include=musicinfo&audioformat=mp32" +
        "&orderby=popularity_total&boost=popularity_total";
    var res = await fetch(url);
    if (!res.ok) throw new Error("Jamendo HTTP " + res.status);
    var data = await res.json();
    return (data.results || []).filter(function (t) { return t.audio || t.audiodownload; }).map(mapJamendoTrack);
}

async function loadJamendoCharts() {
    if (!isJamendoConfigured()) return;
    try {
        var charts = await fetchJamendoPopular(16);
        if (!charts.length) charts = await fetchJamendo("pop", 16);
        if (charts.length) {
            clearAndFill("popular", charts, "row", charts);
        }
    } catch (e) { console.error("jamendo charts", e); }
}

var searchTimer = null;
var lastSearchToken = 0;

function searchMusic() {
    const input = document.getElementById("search");
    const mobile = document.getElementById("searchMobile");
    const raw = (input && input.value) || (mobile && mobile.value) || "";
    const query = raw.trim();

    if (searchTimer) clearTimeout(searchTimer);

    if (!query) {
        clearAndFill("recommendations", recommendationsList, "card", recommendationsList);
        clearAndFill("popular", popularList, "row", popularList);
        songs = [...catalog];
        if (isJamendoConfigured()) loadJamendoCharts();
        return;
    }

    const q = query.toLowerCase();
    const localResults = catalog.filter(s =>
        s.title.toLowerCase().includes(q) ||
        s.artist.toLowerCase().includes(q)
    );
    clearAndFill("recommendations", localResults, "card", localResults);
    songs = localResults.length ? localResults : [...catalog];

    if (!isJamendoConfigured()) return;

    searchTimer = setTimeout(async function () {
        const token = ++lastSearchToken;
        try {
            const remote = await fetchJamendo(query, 30);
            if (token !== lastSearchToken) return;
            const seen = new Set(localResults.map(s => (s.title + "|" + s.artist).toLowerCase()));
            const merged = localResults.slice();
            remote.forEach(function (t) {
                const key = (t.title + "|" + t.artist).toLowerCase();
                if (!seen.has(key)) { seen.add(key); merged.push(t); }
            });
            songs = merged.filter(function (t) { return !!t.audio; });
            clearAndFill("recommendations", merged, "card", songs);
            clearAndFill("popular", merged.slice(0, 12), "row", songs);
            if (typeof showToast === "function") showToast("Jamendo: " + merged.length);
        } catch (e) {
            console.error(e);
            if (token !== lastSearchToken) return;
            if (typeof showToast === "function") showToast("Jamendo: ошибка поиска");
        }
    }, 400);
}

        "  float ph3=(wp.x+wp.y)*f3+ts*0.2+seed*4.5;",
        "  h+=sin(ph3)*0.18; g+=cos(ph3)*0.18*vec2(f3,f3);",
        "  float f4x=freq*1.8, f4y=freq*1.2;",
        "  float ph4=wp.x*f4x+wp.y*f4y-ts*0.35+seed*0.7;",
        "  h+=sin(ph4)*0.08; g+=cos(ph4)*0.08*vec2(f4x,f4y);",
        "  return vec3(h, g);",
        "}",
        "",
        "float kajiyaSpec(vec2 grad, vec3 L, vec3 V, float shine){",
        "  float gl2=dot(grad,grad);",
        "  if(gl2<0.0001) return 0.0;",
        "  vec2 tg=vec2(-grad.y, grad.x)/sqrt(gl2);",
        "  vec3 T=normalize(vec3(tg, 0.0));",
        "  vec3 H=normalize(L+V);",
        "  float TdH=dot(T,H);",
        "  return pow(sqrt(max(1.0-TdH*TdH, 0.0)), shine);",
        "}",
        "",
        "vec4 shadeLayer(",
        "  vec2 p, float t,",
        "  float seed, float freq, float flow,",
        "  vec3 darkCol, vec3 midCol, vec3 brightCol, vec3 specCol,",
        "  float opacity, float shine,",
        "  vec3 L1, vec3 L2, vec3 V,",
        "  float sheenMul",
        "){",
        "  vec3 fold=opacity<0.35 ? fabricFoldLite(p, t, seed, freq, flow) : fabricFold(p, t, seed, freq, flow);",
        "  float h=fold.x;",
        "  vec2 grad=fold.yz;",
        "  vec3 N=normalize(vec3(-grad*1.8, 1.0));",
        "  float NdL1=max(dot(N, L1), 0.0);",
        "  float NdL2=max(dot(N, L2), 0.0);",
        "  float lit=NdL1*0.75+NdL2*0.12;",
        "  float depth=smoothstep(-0.8, 0.4, h);",
        "  float shade=lit*depth;",
        "  float midBlend=smoothstep(0.0, 0.35, shade);",
        "  float brightBlend=smoothstep(0.25, 0.7, shade);",
        "  vec3 fabric=mix(darkCol, midCol, midBlend);",
        "  fabric=mix(fabric, brightCol, brightBlend*0.5);",
        "  float sp=kajiyaSpec(grad, L1, V, shine)*0.9;",
        "  sp+=kajiyaSpec(grad, L2, V, shine*0.6)*0.15;",
        "  sp*=sheenMul;",
        "  float specPow=sp*sp*sp;",
        "  fabric+=specCol*specPow*0.9;",
        "  float trans=smoothstep(0.3, 0.9, depth)*lit*0.08;",
        "  fabric+=vec3(0.55, 0.58, 0.65)*trans;",
        "  float sparkle=hash12(floor(p*500.0+t*0.7));",
        "  sparkle=step(0.9992, sparkle)*specPow*20.0*sheenMul;",
        "  fabric+=specCol*min(sparkle, 2.0);",
        "  float alpha=opacity*(0.65+depth*0.35);",
        "  return vec4(fabric, alpha);",
        "}",
        "",
        "void main(){",
        "  vec2 uv=gl_FragCoord.xy/u_res;",
        "  float aspect=u_res.x/u_res.y;",
        "  vec2 p=(uv-0.5)*vec2(aspect, 1.0);",
        "  float t=u_time*u_flowSpeed;",
        "",
        "  vec3 L1=normalize(vec3(",
        "    0.4+sin(t*0.07)*0.3,",
        "    0.9+cos(t*0.09)*0.15,",
        "    0.8",
        "  ));",
        "  if (u_mouse.x > 0.0) {",
        "    vec2 mUV = u_mouse / u_res - 0.5;",
        "    L1 = normalize(vec3(mUV.x * 2.0, mUV.y * 2.0 + 0.5, 0.8));",
        "  }",
        "  vec3 L2=normalize(vec3(",
        "    -0.7+cos(t*0.06)*0.2,",
        "    -0.3+sin(t*0.08)*0.15,",
        "    0.6",
        "  ));",
        "  vec3 V=vec3(0.0, 0.0, 1.0);",
        "",
        "  // transparent dark bg so page shows through",
        "  float bgD=length(p);",
        "  vec3 bg=mix(",
        "    vec3(0.04, 0.04, 0.05),",
        "    vec3(0.01, 0.01, 0.012),",
        "    smoothstep(0.0, 1.0, bgD)",
        "  );",
        "  bg+=vec3(0.03, 0.03, 0.04)*exp(-bgD*bgD*2.0);",
        "  float bgAlpha=0.15+0.25*exp(-bgD*bgD*1.5);",
        "",
        "  // Layer 1: deep silver (slow)",
        "  vec4 ly1=shadeLayer(",
        "    p*0.8+vec2(0.15, t*0.015), t,",
        "    0.0, 2.0, 0.5,",
        "    vec3(0.06, 0.06, 0.08),",
        "    vec3(0.28, 0.30, 0.35),",
        "    vec3(0.55, 0.58, 0.65),",
        "    vec3(0.95, 0.96, 1.0),",
        "    0.32, 26.0,",
        "    L1, L2, V,",
        "    u_sheenIntensity*0.7",
        "  );",
        "",
        "  // Layer 2: mid chrome",
        "  vec4 ly2=shadeLayer(",
        "    p*1.0+vec2(t*0.012, -0.1), t,",
        "    1.0, 3.2, 0.75,",
        "    vec3(0.05, 0.05, 0.07),",
        "    vec3(0.35, 0.37, 0.42),",
        "    vec3(0.65, 0.68, 0.75),",
        "    vec3(1.0, 1.0, 1.0),",
        "    0.40, 40.0,",
        "    L1, L2, V,",
        "    u_sheenIntensity*0.9",
        "  );",
        "",
        "  // Layer 3: front bright silk",
        "  vec4 ly3=shadeLayer(",
        "    p*1.2+vec2(-t*0.008, t*0.02), t,",
        "    2.0, 4.5, 1.0,",
        "    vec3(0.07, 0.07, 0.09),",
        "    vec3(0.42, 0.44, 0.50),",
        "    vec3(0.78, 0.80, 0.88),",
        "    vec3(1.0, 1.0, 1.0),",
        "    0.48, 55.0,",
        "    L1, L2, V,",
        "    u_sheenIntensity",
        "  );",
        "",
        "  vec3 col=bg;",
        "  float a=bgAlpha;",
        "  col=mix(col, ly1.rgb, ly1.a); a=max(a, ly1.a);",
        "  col+=vec3(0.25, 0.26, 0.30)*ly1.a*ly2.a*0.08;",
        "  col=mix(col, ly2.rgb, ly2.a); a=max(a, ly2.a);",
        "  col+=vec3(0.22, 0.24, 0.28)*ly2.a*ly3.a*0.06;",
        "  col+=vec3(0.28, 0.30, 0.34)*ly1.a*ly2.a*ly3.a*0.04;",
        "  col=mix(col, ly3.rgb, ly3.a); a=max(a, ly3.a);",
        "",
        "  float cov=(ly1.a+ly2.a+ly3.a)*0.333;",
        "  col+=vec3(0.30, 0.32, 0.38)*cov*0.04;",
        "",
        "  float vig=1.0-smoothstep(0.25, 1.15, length(p*vec2(0.85,1.0)));",
        "  col*=0.65+0.35*vig;",
        "",
        "  float lum=dot(col, vec3(0.299, 0.587, 0.114));",
        "  col=mix(vec3(lum), col, 1.15);",
        "",
        "  col=col*(2.51*col+0.03)/(col*(2.43*col+0.59)+0.14);",
        "  col=pow(max(col,0.0), vec3(0.4545));",
        "",
        "  float grain=hash12(gl_FragCoord.xy+fract(u_time*7.13)*100.0);",
        "  col+=(grain-0.5)*0.012;",
        "",
        "  gl_FragColor=vec4(clamp(col,0.0,1.0), clamp(a, 0.0, 1.0));",
        "}"
    ].join("\n");

    function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            console.error("Shader error:", gl.getShaderInfoLog(s));
        }
        return s;
    }

    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vertSrc));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fragSrc));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error("Link error:", gl.getProgramInfoLog(prog));
        return;
    }
    gl.useProgram(prog);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(prog, "a_pos");
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    var uTime = gl.getUniformLocation(prog, "u_time");
    var uRes = gl.getUniformLocation(prog, "u_res");
    var uFlowSpeed = gl.getUniformLocation(prog, "u_flowSpeed");
    var uSheenIntensity = gl.getUniformLocation(prog, "u_sheenIntensity");
    var uMouse = gl.getUniformLocation(prog, "u_mouse");

    var flowSpeedVal = 0.25;
    var targetFlow = 0.25;
    var sheenIntensityVal = 0.7;
    var targetSheen = 0.7;
    var dpr = 1.0;
    var mouseX = -1.0, mouseY = -1.0;
    var needsResize = true;
    var running = true;

    window.__metaSetPlaying = function (playing) {
        targetFlow = playing ? 0.7 : 0.2;
        targetSheen = playing ? 1.15 : 0.6;
    };

    var orbEl = document.getElementById("balanceOrb") || document.getElementById("heroBalance");
    if (orbEl) {
        orbEl.addEventListener("mousemove", function (e) {
            var rect = canvas.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) * dpr;
            mouseY = (rect.height - (e.clientY - rect.top)) * dpr;
        });
        orbEl.addEventListener("mouseleave", function () {
            mouseX = -1.0;
            mouseY = -1.0;
        });
    }

    function resize() {
        needsResize = false;
        var w = Math.round(canvas.clientWidth * dpr);
        var h = Math.round(canvas.clientHeight * dpr);
        if (w < 1 || h < 1) return;
        if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
            gl.viewport(0, 0, w, h);
            gl.uniform2f(uRes, canvas.width, canvas.height);
        }
    }

    function render(now) {
        if (!running) return;
        if (needsResize) resize();
        flowSpeedVal += (targetFlow - flowSpeedVal) * 0.04;
        sheenIntensityVal += (targetSheen - sheenIntensityVal) * 0.04;
        gl.uniform1f(uTime, prefersReduced ? 0.0 : now * 0.001);
        gl.uniform1f(uFlowSpeed, flowSpeedVal);
        gl.uniform1f(uSheenIntensity, sheenIntensityVal);
        gl.uniform2f(uMouse, mouseX, mouseY);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(render);
    }

    window.addEventListener("resize", function () { needsResize = true; });
    if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(function () { needsResize = true; }).observe(canvas.parentElement || canvas);
    }

    document.addEventListener("visibilitychange", function () {
        if (document.hidden) running = false;
        else {
            running = true;
            requestAnimationFrame(render);
        }
    });

    resize();
    requestAnimationFrame(render);
})();

</script>

</body>
</html>
